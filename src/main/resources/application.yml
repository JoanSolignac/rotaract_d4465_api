spring:
  application:
    name: rotaract_d4465_api

  datasource:
    # Usa primero las variables locales (MYSQL_*) y si no existen, las de producción (SPRING_DATASOURCE_*)
    url: ${MYSQL_JDBC_URL:${SPRING_DATASOURCE_URL}}
    username: ${MYSQL_USER:${SPRING_DATASOURCE_USERNAME}}
    password: ${MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  output:
    ansi:
      enabled: ALWAYS

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/rotaract_d4465.log

cors:
  allowed-origins: "*"
  allowed-methods: GET, POST, PUT, DELETE, OPTIONS
  allowed-headers: "*"
  allow-credentials: true
